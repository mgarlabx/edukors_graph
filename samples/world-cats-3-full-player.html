<!--
  Edukors player -- one file, no build step.
  It runs a course written against https://edukors.org/graph/schema/v1/,
  embedded below in <script id="edukors-player-boot">.

  Dynamic nodes ask the model of the host this file runs in, with no key and
  nothing to configure. The player tries, in order:
    1. claude.use("sample") -- an Artifact published with capabilities {sample: {}}
       (e.g. from Claude Code); the viewer consents and pays with their account;
    2. fetch to api.anthropic.com -- intercepted inside claude.ai chat artifacts;
    3. window.claude.complete -- the flat API of claude.ai chat artifacts.
  Anywhere else (a local file, an IDE preview, another harness) no host answers,
  and those steps show a retry instead of content; the rest of the course runs.

  The choice, score and noul nodes ask no model here, in any copy. In the author's
  copy they show a panel: the question as written, the author picks a level and a
  confidence, and a button saves the request -- {model, state, questions}, with
  every {{STORAGE: key}} already resolved -- as JSON, to paste into
  https://console.typesafe.ai/playground and see how the model would answer it.
  The model named there is this player's own choice, jev-1.13.0: a course names
  no model, and a server that judges for real answers with the one it names.

  Outside that copy no judgement is made, and none is invented: the node stores
  nothing at all and the student leaves by the unconditional edge, which every
  course is required to have. This matters because a grade and the feedback
  written from it come out of the same answer, so a made-up level would become a
  confident, false account of the student's own work.

  A dynamic node with `from` is written from a judgement: it receives that
  judgement rendered in full after its prompt -- the levels, their texts, the
  weights, the points and the confidence -- and its prompt says how to write,
  never what to decide.
-->

<script type="application/json" id="edukors-player-boot">{"course": {"$schema": "https://edukors.org/graph/schema/v1/", "info": {"course-id": "a92bcbb0-0c27-49c6-8b84-0c7d24da6634", "source-language": "en", "other-languages": ["pt", "zh"], "title": [{"lang": "en", "text": "Cats of the World 3 (full)"}, {"lang": "pt", "text": "Gatos do Mundo 3 (completo)"}, {"lang": "zh", "text": "世界猫科动物"}], "description": [{"lang": "en", "text": "A journey through the planet's cats, from savanna lions to the cat on your sofa. A short adaptive course: the path changes with your choices and answers."}, {"lang": "pt", "text": "Uma viagem pelos felinos do planeta, dos leões da savana ao gato do sofá. Curso curto e adaptativo: o caminho muda conforme suas escolhas e respostas."}, {"lang": "zh", "text": "一段穿越地球猫科动物的旅程，从草原上的狮子到你沙发上的猫。一门简短的自适应课程：路径会随你的选择和答案而改变。"}], "author": "Mauricio Garcia", "version": "2.0.0", "date": "2026-09-20", "start": "sm1", "sections": [{"number": 1, "title": [{"lang": "en", "text": "Arrival and choice"}, {"lang": "pt", "text": "Chegada e escolha"}, {"lang": "zh", "text": "到达与选择"}]}, {"number": 2, "title": [{"lang": "en", "text": "Check and personalisation"}, {"lang": "pt", "text": "Verificação e personalização"}, {"lang": "zh", "text": "检验与个性化"}]}, {"number": 3, "title": [{"lang": "en", "text": "Delivery and closing"}, {"lang": "pt", "text": "Entrega e encerramento"}, {"lang": "zh", "text": "提交与结课"}]}], "system-prompt": "You are a friendly natural-history guide in a short course about the cats of the world (family Felidae) for a general, international audience with no biology background. Be warm, concrete and accurate; prefer well-established facts about species, habitats and behaviour, and say 'roughly' when numbers vary between sources. Never invent image URLs. Use metric units. Answer in the student's language."}, "nodes": [{"id": "sm1", "type": "static-md", "section": 1, "title": [{"lang": "en", "text": "Welcome to the world of cats"}, {"lang": "pt", "text": "Bem-vindo ao mundo dos felinos"}, {"lang": "zh", "text": "欢迎来到猫科动物的世界"}], "content": {"item": [{"lang": "en", "text": "## Welcome to the world of cats\n\n![Lion resting in Namibia](https://commons.wikimedia.org/wiki/Special:FilePath/Lion%20waiting%20in%20Namibia.jpg?width=800)\n\nThere are about 40 species of cats on the planet, and they live on every continent except Antarctica and Oceania (where they arrived only in human hands). All of them descend from a common ancestor that lived some 10 million years ago, so they share one \"blueprint\": retractable claws, teeth built for slicing meat, excellent night vision and a body designed for the ambush. A 190 kg lion and a 4 kg sofa cat are, at heart, variations on the same theme.\n\nThis course is a journey through that group. You will meet three families of cats:\n\n- **The big cats**: lion, tiger, jaguar, leopard, snow leopard, puma and cheetah.\n- **The small wild cats**: lynx, serval, Pallas's cat, sand cat and European wildcat, among others that rarely make it into documentaries.\n- **Domestic cats**: how the cat moved into our homes some 10,000 years ago and spread around the world on ships.\n\n### How the course works\n\nThe path is not the same for everyone. In the next step you say which group you want to explore first, and the course opens that chapter. Then comes a quick check: if you do well, you move straight on; if not, you get a reinforcement written specifically for what you got wrong. Later, you can ask for a visual card with the cat that best fits your profile, you write a short text and receive an assessment. At the end, you can come back and explore another group, as many times as you like.\n\nBy the end, you will be able to:\n\n1. Tell big cats from small cats and say where each one lives.\n2. Explain what makes cats such efficient hunters.\n3. Tell the story of the cat's domestication.\n4. Argue, in writing, which cat you would \"adopt\" and why.\n\nLet's begin."}, {"lang": "pt", "text": "## Bem-vindo ao mundo dos felinos\n\n![Leão descansando na Namíbia](https://commons.wikimedia.org/wiki/Special:FilePath/Lion%20waiting%20in%20Namibia.jpg?width=800)\n\nExistem cerca de 40 espécies de felinos no planeta, e elas vivem em todos os continentes, exceto a Antártida e a Oceania (onde só chegaram pelas mãos dos humanos). Todas descendem de um ancestral comum que viveu há uns 10 milhões de anos, e por isso compartilham um mesmo \"projeto\": garras retráteis, dentes feitos para cortar carne, visão noturna excelente e um corpo desenhado para a emboscada. Um leão de 190 kg e um gato de sofá de 4 kg são, no fundo, variações do mesmo tema.\n\nEste curso é uma viagem por esse grupo. Você vai conhecer três famílias de felinos:\n\n- **Os grandes felinos**: leão, tigre, onça-pintada, leopardo, leopardo-das-neves, puma e guepardo.\n- **Os pequenos felinos selvagens**: lince, serval, gato-de-pallas, gato-do-deserto e gato-selvagem-europeu, entre outros que raramente aparecem em documentários.\n- **Os gatos domésticos**: como o gato entrou nas casas há uns 10 mil anos e como se espalhou pelo mundo em navios.\n\n### Como o curso funciona\n\nO caminho não é o mesmo para todo mundo. No próximo passo você diz qual grupo quer explorar primeiro, e o curso abre esse capítulo. Depois vem uma verificação rápida: se você acertar bem, segue direto; se não, recebe um reforço escrito sob medida para o que você errou. Mais adiante, você pode pedir um cartão visual com o felino que mais combina com seu perfil, escreve um texto curto e recebe uma avaliação. No fim, pode voltar e explorar outro grupo, quantas vezes quiser.\n\nAo terminar, você vai conseguir:\n\n1. Distinguir os grandes felinos dos pequenos e dizer onde cada um vive.\n2. Explicar o que torna os felinos caçadores tão eficientes.\n3. Contar a história da domesticação do gato.\n4. Argumentar, por escrito, que felino você \"adotaria\" e por quê.\n\nVamos começar."}, {"lang": "zh", "text": "## 欢迎来到猫科动物的世界\n\n![在纳米比亚休息的狮子](https://commons.wikimedia.org/wiki/Special:FilePath/Lion%20waiting%20in%20Namibia.jpg?width=800)\n\n地球上大约有 40 种猫科动物，除南极洲和大洋洲（它们只是随人类到达那里）之外，每个大陆都有它们的身影。所有猫科动物都源自大约 1000 万年前的一个共同祖先，因此共享同一套\"设计图\"：可伸缩的爪子、专为切割肉类而生的牙齿、出色的夜视能力，以及为伏击而设计的身体。一头 190 公斤的狮子和一只 4 公斤的沙发猫，本质上是同一主题的不同变奏。\n\n本课程是一段穿越这个类群的旅程。你将认识三类猫科动物：\n\n- **大型猫科动物**：狮子、老虎、美洲豹、花豹、雪豹、美洲狮和猎豹。\n- **小型野生猫科动物**：猞猁、薮猫、兔狲、沙猫和欧洲野猫等，它们很少出现在纪录片里。\n- **家猫**：大约一万年前猫如何走进人类家庭，又如何随船只传遍世界。\n\n### 课程如何进行\n\n每个人的路径并不相同。下一步你将选择先探索哪个类群，课程会打开相应的章节。接着是一次快速检验：答得好就直接前进；否则你会收到一段专门针对错题写的强化内容。之后，你可以请求一张与你的个人档案最匹配的猫科动物的可视化卡片，再写一篇短文并获得评估。最后，你可以回到起点探索另一个类群，次数不限。\n\n完成课程后，你将能够：\n\n1. 区分大型与小型猫科动物，并说出它们各自的栖息地。\n2. 解释猫科动物为何是如此高效的猎手。\n3. 讲述猫被驯化的历史。\n4. 以书面形式论证你会\"领养\"哪种猫科动物以及原因。\n\n让我们开始吧。"}]}}, {"id": "f1", "type": "form", "section": 1, "title": [{"lang": "en", "text": "Explorer profile"}, {"lang": "pt", "text": "Perfil do explorador"}, {"lang": "zh", "text": "探索者档案"}], "content": {"items": [{"key": "interest", "type": "radio", "required": true, "label": [{"lang": "en", "text": "Which group of cats do you want to explore now?"}, {"lang": "pt", "text": "Qual grupo de felinos você quer explorar agora?"}, {"lang": "zh", "text": "你现在想探索哪一类猫科动物？"}], "options": [{"value": "big", "label": [{"lang": "en", "text": "Big cats"}, {"lang": "pt", "text": "Grandes felinos"}, {"lang": "zh", "text": "大型猫科动物"}]}, {"value": "small", "label": [{"lang": "en", "text": "Small wild cats"}, {"lang": "pt", "text": "Pequenos felinos selvagens"}, {"lang": "zh", "text": "小型野生猫科动物"}]}, {"value": "domestic", "label": [{"lang": "en", "text": "Domestic cats"}, {"lang": "pt", "text": "Gatos domésticos"}, {"lang": "zh", "text": "家猫"}]}]}, {"key": "country", "type": "text-line", "required": false, "label": [{"lang": "en", "text": "Which country are you from? (we use this to pick examples close to you)"}, {"lang": "pt", "text": "De que país você é? (usamos isso para escolher exemplos próximos de você)"}, {"lang": "zh", "text": "你来自哪个国家？（我们会据此选择贴近你的例子）"}]}]}}, {"id": "sh1", "type": "static-html", "section": 1, "title": [{"lang": "en", "text": "Big cats: who is who"}, {"lang": "pt", "text": "Grandes felinos: quem é quem"}, {"lang": "zh", "text": "大型猫科动物：谁是谁"}], "content": {"item": [{"lang": "en", "text": "\u003ch2>Big cats: who is who\u003c/h2>\n\u003cp>\"Big cat\" is not a strict scientific term. It usually covers the five members of the genus \u003cem>Panthera\u003c/em> (lion, tiger, jaguar, leopard and snow leopard), which have a flexible throat bone and can therefore \u003cstrong>roar\u003c/strong>, plus the puma and the cheetah, which are big in size but belong to \"small cat\" lineages: they do not roar, but they \u003cstrong>purr\u003c/strong> like a house cat.\u003c/p>\n\u003ctable style=\"width:100%;border-collapse:collapse;font-size:0.95em\">\n\u003cthead>\u003ctr style=\"background:#f0e6d8\">\u003cth style=\"padding:6px;text-align:left\">Species\u003c/th>\u003cth style=\"padding:6px;text-align:left\">Where it lives\u003c/th>\u003cth style=\"padding:6px;text-align:left\">Typical weight\u003c/th>\u003cth style=\"padding:6px;text-align:left\">Trademark\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>Lion\u003c/strong>\u003cbr>\u003cem>Panthera leo\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">African savannas; one small population in the Gir Forest, India\u003c/td>\u003ctd style=\"padding:6px\">120 to 190 kg\u003c/td>\u003ctd style=\"padding:6px\">The only social cat: lives in prides, and the females hunt as a group\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>Tiger\u003c/strong>\u003cbr>\u003cem>Panthera tigris\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">Forests and swamps of Asia, from India to the Russian Far East\u003c/td>\u003ctd style=\"padding:6px\">100 to 260 kg\u003c/td>\u003ctd style=\"padding:6px\">The largest living cat; each tiger has a unique stripe pattern, like a fingerprint\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>Jaguar\u003c/strong>\u003cbr>\u003cem>Panthera onca\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">From Mexico to Argentina, mainly the Amazon and the Pantanal\u003c/td>\u003ctd style=\"padding:6px\">55 to 100 kg\u003c/td>\u003ctd style=\"padding:6px\">Strongest bite for its size; an excellent swimmer that hunts caimans\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>Leopard\u003c/strong>\u003cbr>\u003cem>Panthera pardus\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">Africa and much of Asia\u003c/td>\u003ctd style=\"padding:6px\">30 to 70 kg\u003c/td>\u003ctd style=\"padding:6px\">The most adaptable: lives from deserts to cities; stores its prey up in trees\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>Snow leopard\u003c/strong>\u003cbr>\u003cem>Panthera uncia\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">Mountains of Central Asia, above 3,000 m\u003c/td>\u003ctd style=\"padding:6px\">25 to 55 kg\u003c/td>\u003ctd style=\"padding:6px\">A tail almost as long as its body, used as a blanket; cannot roar\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>Puma\u003c/strong>\u003cbr>\u003cem>Puma concolor\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">From Canada to Patagonia: the widest range of any land mammal in the Americas\u003c/td>\u003ctd style=\"padding:6px\">35 to 80 kg\u003c/td>\u003ctd style=\"padding:6px\">Jumps more than 5 m high; purrs\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>Cheetah\u003c/strong>\u003cbr>\u003cem>Acinonyx jubatus\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">Open savannas of Africa; a few dozen in Iran\u003c/td>\u003ctd style=\"padding:6px\">35 to 65 kg\u003c/td>\u003ctd style=\"padding:6px\">Fastest land animal, close to 100 km/h in short sprints; semi-retractable claws, like running spikes\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\n\u003ch3>Three portraits\u003c/h3>\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:12px\">\n\u003cfigure style=\"flex:1 1 220px;margin:0\">\u003cimg src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Walking%20tiger%20female.jpg?width=600\" alt=\"Tigress walking through tall grass\" style=\"width:100%;border-radius:8px\">\u003cfigcaption style=\"font-size:0.85em\">Tigress. The stripes break up her outline in tall vegetation.\u003c/figcaption>\u003c/figure>\n\u003cfigure style=\"flex:1 1 220px;margin:0\">\u003cimg src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Standing%20jaguar.jpg?width=600\" alt=\"Standing jaguar\" style=\"width:100%;border-radius:8px\">\u003cfigcaption style=\"font-size:0.85em\">Jaguar. Note the rosettes with a dot in the middle, which the leopard lacks.\u003c/figcaption>\u003c/figure>\n\u003cfigure style=\"flex:1 1 220px;margin:0\">\u003cimg src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Uncia%20uncia.jpg?width=600\" alt=\"Snow leopard\" style=\"width:100%;border-radius:8px\">\u003cfigcaption style=\"font-size:0.85em\">Snow leopard. Thick fur and a long tail for the mountain cold.\u003c/figcaption>\u003c/figure>\n\u003c/div>\n\n\u003ch3>Why they matter\u003c/h3>\n\u003cp>Big cats sit at the top of the food chain. Where they disappear, herbivores multiply, vegetation changes and rivers can even shift course. That is why they are called \u003cstrong>umbrella species\u003c/strong>: protecting a tiger means protecting the whole forest it hunts in. Today all seven are in decline; the tiger, for example, occupies less than 7% of the range it had a century ago.\u003c/p>\n\u003cp>\u003csmall>Images: Wikimedia Commons.\u003c/small>\u003c/p>"}, {"lang": "pt", "text": "\u003ch2>Grandes felinos: quem é quem\u003c/h2>\n\u003cp>\"Grande felino\" não é um termo científico rigoroso. Costuma incluir os cinco membros do gênero \u003cem>Panthera\u003c/em> (leão, tigre, onça-pintada, leopardo e leopardo-das-neves), que têm um osso da garganta flexível e por isso conseguem \u003cstrong>rugir\u003c/strong>, e também o puma e o guepardo, que são grandes no tamanho mas pertencem a linhagens de \"pequenos felinos\": eles não rugem, mas \u003cstrong>ronronam\u003c/strong> como um gato doméstico.\u003c/p>\n\u003ctable style=\"width:100%;border-collapse:collapse;font-size:0.95em\">\n\u003cthead>\u003ctr style=\"background:#f0e6d8\">\u003cth style=\"padding:6px;text-align:left\">Espécie\u003c/th>\u003cth style=\"padding:6px;text-align:left\">Onde vive\u003c/th>\u003cth style=\"padding:6px;text-align:left\">Peso típico\u003c/th>\u003cth style=\"padding:6px;text-align:left\">Marca registrada\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>Leão\u003c/strong>\u003cbr>\u003cem>Panthera leo\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">Savanas da África; uma pequena população na floresta de Gir, Índia\u003c/td>\u003ctd style=\"padding:6px\">120 a 190 kg\u003c/td>\u003ctd style=\"padding:6px\">O único felino social: vive em bandos, e as fêmeas caçam em grupo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>Tigre\u003c/strong>\u003cbr>\u003cem>Panthera tigris\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">Florestas e pântanos da Ásia, da Índia ao extremo leste da Rússia\u003c/td>\u003ctd style=\"padding:6px\">100 a 260 kg\u003c/td>\u003ctd style=\"padding:6px\">O maior felino vivo; cada tigre tem um padrão de listras único, como uma impressão digital\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>Onça-pintada\u003c/strong>\u003cbr>\u003cem>Panthera onca\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">Do México à Argentina, sobretudo Amazônia e Pantanal\u003c/td>\u003ctd style=\"padding:6px\">55 a 100 kg\u003c/td>\u003ctd style=\"padding:6px\">Mordida mais forte em relação ao tamanho; nada muito bem e caça jacarés\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>Leopardo\u003c/strong>\u003cbr>\u003cem>Panthera pardus\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">África e grande parte da Ásia\u003c/td>\u003ctd style=\"padding:6px\">30 a 70 kg\u003c/td>\u003ctd style=\"padding:6px\">O mais adaptável: vive de desertos a cidades; guarda a presa em cima de árvores\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>Leopardo-das-neves\u003c/strong>\u003cbr>\u003cem>Panthera uncia\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">Montanhas da Ásia Central, acima de 3.000 m\u003c/td>\u003ctd style=\"padding:6px\">25 a 55 kg\u003c/td>\u003ctd style=\"padding:6px\">Cauda quase do tamanho do corpo, usada como cobertor; não consegue rugir\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>Puma\u003c/strong>\u003cbr>\u003cem>Puma concolor\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">Do Canadá à Patagônia: a maior distribuição de um mamífero terrestre nas Américas\u003c/td>\u003ctd style=\"padding:6px\">35 a 80 kg\u003c/td>\u003ctd style=\"padding:6px\">Salta mais de 5 m de altura; ronrona\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>Guepardo\u003c/strong>\u003cbr>\u003cem>Acinonyx jubatus\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">Savanas abertas da África; poucas dezenas no Irã\u003c/td>\u003ctd style=\"padding:6px\">35 a 65 kg\u003c/td>\u003ctd style=\"padding:6px\">Animal terrestre mais rápido, perto de 100 km/h em arrancadas curtas; garras semirretráteis, como travas de corrida\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\n\u003ch3>Três retratos\u003c/h3>\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:12px\">\n\u003cfigure style=\"flex:1 1 220px;margin:0\">\u003cimg src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Walking%20tiger%20female.jpg?width=600\" alt=\"Tigresa caminhando na grama alta\" style=\"width:100%;border-radius:8px\">\u003cfigcaption style=\"font-size:0.85em\">Tigresa. As listras quebram a silhueta na vegetação alta.\u003c/figcaption>\u003c/figure>\n\u003cfigure style=\"flex:1 1 220px;margin:0\">\u003cimg src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Standing%20jaguar.jpg?width=600\" alt=\"Onça-pintada em pé\" style=\"width:100%;border-radius:8px\">\u003cfigcaption style=\"font-size:0.85em\">Onça-pintada. Repare nas rosetas com um ponto no meio, que o leopardo não tem.\u003c/figcaption>\u003c/figure>\n\u003cfigure style=\"flex:1 1 220px;margin:0\">\u003cimg src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Uncia%20uncia.jpg?width=600\" alt=\"Leopardo-das-neves\" style=\"width:100%;border-radius:8px\">\u003cfigcaption style=\"font-size:0.85em\">Leopardo-das-neves. Pelagem espessa e cauda longa para o frio das montanhas.\u003c/figcaption>\u003c/figure>\n\u003c/div>\n\n\u003ch3>Por que eles importam\u003c/h3>\n\u003cp>Grandes felinos ficam no topo da cadeia alimentar. Onde eles desaparecem, herbívoros se multiplicam, a vegetação muda e rios chegam a mudar de curso. Por isso são chamados de \u003cstrong>espécies guarda-chuva\u003c/strong>: proteger um tigre significa proteger a floresta inteira em que ele caça. Hoje todos os sete estão em declínio; o tigre, por exemplo, ocupa menos de 7% da área que ocupava há um século.\u003c/p>\n\u003cp>\u003csmall>Imagens: Wikimedia Commons.\u003c/small>\u003c/p>"}, {"lang": "zh", "text": "\u003ch2>大型猫科动物：谁是谁\u003c/h2>\n\u003cp>\"大型猫科动物\"并不是一个严格的科学术语。它通常包括豹属（\u003cem>Panthera\u003c/em>）的五个成员——狮子、老虎、美洲豹、花豹和雪豹，它们喉部的骨头较为柔韧，因此能够\u003cstrong>吼叫\u003c/strong>；此外还有美洲狮和猎豹，它们体型很大，但属于\"小型猫科\"谱系：它们不会吼叫，而是像家猫一样\u003cstrong>呼噜\u003c/strong>。\u003c/p>\n\u003ctable style=\"width:100%;border-collapse:collapse;font-size:0.95em\">\n\u003cthead>\u003ctr style=\"background:#f0e6d8\">\u003cth style=\"padding:6px;text-align:left\">物种\u003c/th>\u003cth style=\"padding:6px;text-align:left\">栖息地\u003c/th>\u003cth style=\"padding:6px;text-align:left\">典型体重\u003c/th>\u003cth style=\"padding:6px;text-align:left\">标志性特征\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>狮子\u003c/strong>\u003cbr>\u003cem>Panthera leo\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">非洲草原；印度吉尔森林有一个小种群\u003c/td>\u003ctd style=\"padding:6px\">120 至 190 公斤\u003c/td>\u003ctd style=\"padding:6px\">唯一的群居猫科动物：以狮群生活，雌狮集体狩猎\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>老虎\u003c/strong>\u003cbr>\u003cem>Panthera tigris\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">亚洲的森林与沼泽，从印度到俄罗斯远东\u003c/td>\u003ctd style=\"padding:6px\">100 至 260 公斤\u003c/td>\u003ctd style=\"padding:6px\">现存最大的猫科动物；每只老虎的条纹都独一无二，如同指纹\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>美洲豹\u003c/strong>\u003cbr>\u003cem>Panthera onca\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">从墨西哥到阿根廷，主要在亚马逊和潘塔纳尔\u003c/td>\u003ctd style=\"padding:6px\">55 至 100 公斤\u003c/td>\u003ctd style=\"padding:6px\">相对体型咬合力最强；游泳好手，会捕食凯门鳄\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>花豹\u003c/strong>\u003cbr>\u003cem>Panthera pardus\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">非洲和亚洲大部分地区\u003c/td>\u003ctd style=\"padding:6px\">30 至 70 公斤\u003c/td>\u003ctd style=\"padding:6px\">适应力最强：从沙漠到城市都能生存；会把猎物藏到树上\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>雪豹\u003c/strong>\u003cbr>\u003cem>Panthera uncia\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">中亚山地，海拔 3000 米以上\u003c/td>\u003ctd style=\"padding:6px\">25 至 55 公斤\u003c/td>\u003ctd style=\"padding:6px\">尾巴几乎与身体等长，可当作毯子；不会吼叫\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>美洲狮\u003c/strong>\u003cbr>\u003cem>Puma concolor\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">从加拿大到巴塔哥尼亚：美洲陆生哺乳动物中分布最广\u003c/td>\u003ctd style=\"padding:6px\">35 至 80 公斤\u003c/td>\u003ctd style=\"padding:6px\">能跳 5 米以上高；会呼噜\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px\">\u003cstrong>猎豹\u003c/strong>\u003cbr>\u003cem>Acinonyx jubatus\u003c/em>\u003c/td>\u003ctd style=\"padding:6px\">非洲开阔草原；伊朗尚存几十只\u003c/td>\u003ctd style=\"padding:6px\">35 至 65 公斤\u003c/td>\u003ctd style=\"padding:6px\">陆地上最快的动物，短距离冲刺接近 100 公里/小时；爪子半伸缩，如同跑鞋钉\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\n\u003ch3>三幅肖像\u003c/h3>\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:12px\">\n\u003cfigure style=\"flex:1 1 220px;margin:0\">\u003cimg src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Walking%20tiger%20female.jpg?width=600\" alt=\"穿过高草的雌虎\" style=\"width:100%;border-radius:8px\">\u003cfigcaption style=\"font-size:0.85em\">雌虎。条纹在高大的植被中打破了它的轮廓。\u003c/figcaption>\u003c/figure>\n\u003cfigure style=\"flex:1 1 220px;margin:0\">\u003cimg src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Standing%20jaguar.jpg?width=600\" alt=\"站立的美洲豹\" style=\"width:100%;border-radius:8px\">\u003cfigcaption style=\"font-size:0.85em\">美洲豹。注意中间带点的玫瑰斑，花豹没有这一特征。\u003c/figcaption>\u003c/figure>\n\u003cfigure style=\"flex:1 1 220px;margin:0\">\u003cimg src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Uncia%20uncia.jpg?width=600\" alt=\"雪豹\" style=\"width:100%;border-radius:8px\">\u003cfigcaption style=\"font-size:0.85em\">雪豹。厚实的毛皮和长尾巴用来抵御高山严寒。\u003c/figcaption>\u003c/figure>\n\u003c/div>\n\n\u003ch3>它们为何重要\u003c/h3>\n\u003cp>大型猫科动物位于食物链顶端。它们一旦消失，食草动物就会激增，植被随之改变，甚至河流也可能改道。因此它们被称为\u003cstrong>伞护种\u003c/strong>：保护一只老虎，就意味着保护它狩猎的整片森林。如今这七种都在减少；例如老虎的分布范围已不到一个世纪前的 7%。\u003c/p>\n\u003cp>\u003csmall>图片：维基共享资源。\u003c/small>\u003c/p>"}]}}, {"id": "sm2", "type": "static-md", "section": 1, "title": [{"lang": "en", "text": "Small wild cats"}, {"lang": "pt", "text": "Pequenos felinos selvagens"}, {"lang": "zh", "text": "小型野生猫科动物"}], "content": {"item": [{"lang": "en", "text": "## Small wild cats: the ones nobody sees\n\nOf the planet's roughly 40 cats, only 7 are \"big\". The other 33 are small wild cats, and hardly anyone knows their names. Some fit in the palm of a hand as kittens; the largest, the Eurasian lynx, reaches 30 kg. This chapter introduces five of them, chosen for being very different from one another.\n\n### Eurasian lynx (*Lynx lynx*)\n\n![Eurasian lynx](https://commons.wikimedia.org/wiki/Special:FilePath/Lynx%20lynx%20poing.jpg?width=800)\n\nLives in the cold forests of Europe and Asia, from Scandinavia to Tibet. It has huge furry paws that work like snowshoes, and tufts of hair on its ears that help capture sound. It hunts mainly roe deer and hares. It was wiped out across much of Western Europe and is being reintroduced in Switzerland, Germany and France.\n\n### Serval (*Leptailurus serval*)\n\n![Serval in the Serengeti savanna](https://commons.wikimedia.org/wiki/Special:FilePath/Leptailurus%20serval%20-Serengeti%20National%20Park%2C%20Tanzania-8.jpg?width=800)\n\nThe cat with the longest legs relative to its body. It lives in the wet savannas of Africa and hunts rodents hidden in the grass: it listens with its enormous ears, leaps 2 metres into the air and lands with its front paws on the prey. It has one of the highest hunting success rates among cats, close to 50% of attempts.\n\n### Pallas's cat or manul (*Otocolobus manul*)\n\n![Manul](https://commons.wikimedia.org/wiki/Special:FilePath/Manul1.jpg?width=800)\n\nAn inhabitant of the cold steppes of Mongolia and Central Asia. Its fur is so dense that it looks twice its real size; its ears sit low so it does not show above the rocks, and its pupils are round, unlike the vertical slit of most small cats. It lives at close to 4,000 metres of altitude.\n\n### Sand cat (*Felis margarita*)\n\n![Sand cat](https://commons.wikimedia.org/wiki/Special:FilePath/Persian%20sand%20CAT.jpg?width=800)\n\nThe only cat that lives exclusively in deserts, from the Sahara to Iran. It has fur on the soles of its paws for walking on hot sand and can go months without drinking: it gets all the liquid it needs from its prey. It tolerates from -5 °C at night to over 50 °C by day.\n\n### European wildcat (*Felis silvestris*)\n\n![European wildcat](https://commons.wikimedia.org/wiki/Special:FilePath/Felis%20silvestris%20silvestris.jpg?width=800)\n\nIt looks like a sturdy tabby house cat, with a thick, black-tipped tail. It lives in the forests of Europe and is a close relative of the African wildcat, the direct ancestor of the house cat. Its greatest risk today is interbreeding with domestic cats and disappearing as a pure species.\n\n### What the small ones teach\n\nThe small cats show how a single body plan adapts to extreme environments: snow, desert, steppe, savanna. They are also the least studied and least protected, because they draw less attention than a tiger. Several, like the manul and the sand cat, were photographed in the wild for the first time only this century.\n\n*Images: Wikimedia Commons.*"}, {"lang": "pt", "text": "## Pequenos felinos selvagens: os que ninguém vê\n\nDos cerca de 40 felinos do planeta, só 7 são \"grandes\". Os outros 33 são pequenos felinos selvagens, e quase ninguém conhece o nome deles. Alguns cabem na palma da mão quando filhotes; o maior, o lince-eurasiático, chega a 30 kg. Este capítulo apresenta cinco deles, escolhidos por serem muito diferentes uns dos outros.\n\n### Lince-eurasiático (*Lynx lynx*)\n\n![Lince-eurasiático](https://commons.wikimedia.org/wiki/Special:FilePath/Lynx%20lynx%20poing.jpg?width=800)\n\nVive nas florestas frias da Europa e da Ásia, da Escandinávia ao Tibete. Tem patas enormes e peludas que funcionam como raquetes de neve, e tufos de pelo nas orelhas que ajudam a captar sons. Caça sobretudo corços e lebres. Foi extinto em boa parte da Europa Ocidental e vem sendo reintroduzido na Suíça, na Alemanha e na França.\n\n### Serval (*Leptailurus serval*)\n\n![Serval na savana do Serengeti](https://commons.wikimedia.org/wiki/Special:FilePath/Leptailurus%20serval%20-Serengeti%20National%20Park%2C%20Tanzania-8.jpg?width=800)\n\nO felino das pernas mais longas em relação ao corpo. Vive nas savanas úmidas da África e caça roedores escondidos no capim: escuta com as orelhas enormes, dá um salto de 2 metros de altura e cai com as patas dianteiras em cima da presa. Tem uma das maiores taxas de sucesso de caça entre os felinos, perto de 50% das tentativas.\n\n### Gato-de-pallas ou manul (*Otocolobus manul*)\n\n![Manul](https://commons.wikimedia.org/wiki/Special:FilePath/Manul1.jpg?width=800)\n\nHabitante das estepes frias da Mongólia e da Ásia Central. Pelagem tão densa que ele parece o dobro do tamanho real, orelhas baixas para não aparecer acima das pedras e pupilas redondas, diferentes da fenda vertical da maioria dos gatos pequenos. Vive perto de 4.000 metros de altitude.\n\n### Gato-do-deserto (*Felis margarita*)\n\n![Gato-do-deserto](https://commons.wikimedia.org/wiki/Special:FilePath/Persian%20sand%20CAT.jpg?width=800)\n\nO único felino que vive exclusivamente em desertos, do Saara ao Irã. Tem pelo na sola das patas para andar na areia quente e consegue passar meses sem beber água: tira todo o líquido de que precisa das presas. Suporta de -5 °C à noite a mais de 50 °C de dia.\n\n### Gato-selvagem-europeu (*Felis silvestris*)\n\n![Gato-selvagem-europeu](https://commons.wikimedia.org/wiki/Special:FilePath/Felis%20silvestris%20silvestris.jpg?width=800)\n\nParece um gato doméstico malhado e robusto, com cauda grossa terminada em preto. Vive em florestas da Europa e é parente próximo do gato-selvagem-africano, o ancestral direto do gato de casa. O maior risco para ele hoje é cruzar com gatos domésticos e desaparecer como espécie pura.\n\n### O que os pequenos ensinam\n\nOs pequenos felinos mostram como um mesmo projeto de corpo se adapta a ambientes extremos: neve, deserto, estepe, savana. Eles também são os menos estudados e os menos protegidos, porque atraem menos atenção que um tigre. Vários, como o manul e o gato-do-deserto, só foram fotografados na natureza pela primeira vez neste século.\n\n*Imagens: Wikimedia Commons.*"}, {"lang": "zh", "text": "## 小型野生猫科动物：无人注意的它们\n\n地球上大约 40 种猫科动物中，只有 7 种是\"大型\"的。其余 33 种是小型野生猫科动物，几乎没人知道它们的名字。有些幼崽时能放在手掌上；最大的欧亚猞猁可达 30 公斤。本章介绍其中五种，它们彼此差异极大。\n\n### 欧亚猞猁（*Lynx lynx*）\n\n![欧亚猞猁](https://commons.wikimedia.org/wiki/Special:FilePath/Lynx%20lynx%20poing.jpg?width=800)\n\n生活在欧洲和亚洲的寒冷森林，从斯堪的纳维亚到西藏。它有着巨大而多毛的脚掌，如同雪鞋；耳尖的簇毛有助于捕捉声音。主要捕食狍子和野兔。它曾在西欧大部分地区灭绝，目前正在瑞士、德国和法国重新引入。\n\n### 薮猫（*Leptailurus serval*）\n\n![塞伦盖蒂草原上的薮猫](https://commons.wikimedia.org/wiki/Special:FilePath/Leptailurus%20serval%20-Serengeti%20National%20Park%2C%20Tanzania-8.jpg?width=800)\n\n相对身体而言腿最长的猫科动物。它生活在非洲湿润的草原上，捕食藏在草丛中的啮齿动物：用巨大的耳朵倾听，跃起 2 米高，然后用前爪扑向猎物。它的狩猎成功率在猫科动物中名列前茅，接近 50%。\n\n### 兔狲（*Otocolobus manul*）\n\n![兔狲](https://commons.wikimedia.org/wiki/Special:FilePath/Manul1.jpg?width=800)\n\n蒙古和中亚寒冷草原的居民。毛皮极为浓密，看起来是实际体型的两倍；耳朵位置很低，不会露出岩石之上；瞳孔是圆形的，不同于大多数小型猫科动物的竖缝瞳孔。它生活在接近 4000 米的海拔。\n\n### 沙猫（*Felis margarita*）\n\n![沙猫](https://commons.wikimedia.org/wiki/Special:FilePath/Persian%20sand%20CAT.jpg?width=800)\n\n唯一只生活在沙漠中的猫科动物，从撒哈拉到伊朗。脚掌底部长有毛，便于在滚烫的沙子上行走；可以数月不喝水，所需的全部水分都来自猎物。它能承受夜间 -5 °C 到白天 50 °C 以上的温度。\n\n### 欧洲野猫（*Felis silvestris*）\n\n![欧洲野猫](https://commons.wikimedia.org/wiki/Special:FilePath/Felis%20silvestris%20silvestris.jpg?width=800)\n\n外形像一只健壮的虎斑家猫，尾巴粗大、尾尖为黑色。它生活在欧洲的森林中，是非洲野猫的近亲，而非洲野猫正是家猫的直系祖先。如今它面临的最大风险是与家猫杂交，从而作为纯种消失。\n\n### 小型猫科动物教给我们的\n\n小型猫科动物展示了同一套身体结构如何适应极端环境：雪地、沙漠、草原、稀树草原。它们也是研究最少、保护最少的，因为它们不像老虎那样引人注目。其中一些，如兔狲和沙猫，直到本世纪才首次在野外被拍到。\n\n*图片：维基共享资源。*"}]}}, {"id": "sm3", "type": "static-md", "section": 1, "title": [{"lang": "en", "text": "Domestic cats around the world"}, {"lang": "pt", "text": "Gatos domésticos pelo mundo"}, {"lang": "zh", "text": "世界各地的家猫"}], "content": {"item": [{"lang": "en", "text": "## Domestic cats around the world\n\n![Domestic cat](https://commons.wikimedia.org/wiki/Special:FilePath/Cat%20November%202010-1a.jpg?width=800)\n\nThe house cat (*Felis catus*) is the most numerous cat on the planet: estimates run between 400 and 600 million, on every inhabited continent. And it is the only one that, to a large extent, chose to live with us.\n\n### How the cat moved in\n\nAll domestic cats descend from the **African wildcat** (*Felis lybica*), a small cat of the Middle East and North Africa. The story begins some 10,000 years ago, when the first farmers of the Fertile Crescent started storing grain. Grain attracted mice; mice attracted wildcats. The less fearful cats stayed near the villages, ate well and left more kittens. It was a two-way domestication: nobody \"captured\" the cat, it came closer on its own.\n\nThe oldest evidence of this relationship is a grave in Cyprus, about 9,500 years old, where a human was buried next to a cat. Since there were no wildcats on Cyprus, someone brought it by boat.\n\n### Egypt and the ships\n\nIn Egypt, from around 4,000 years ago, the cat became a pet and an object of worship: the goddess Bastet had a cat's head, and killing a cat could be punished by death. From there cats boarded Phoenician, Roman and, centuries later, Viking ships, always with the same job: controlling rats on board. That is why cats reached practically every port in the world before any other route. DNA studies show that the Egyptian lineage conquered the world precisely because of maritime trade.\n\n### Breeds: four examples from four continents\n\n| Breed | Origin | What sets it apart |\n|---|---|---|\n| **Siamese** | Thailand (formerly Siam), described since the 14th century | Pale body and dark points: the pigment only forms on the cooler parts of the body |\n| **Maine Coon** | Northeastern United States | One of the largest breeds, up to 8 kg, with a dense coat for winter |\n| **Sphynx** | Canada, from 1966 | A natural mutation that suppresses the coat; needs baths and warm clothing |\n| **Egyptian Mau** | Egypt | One of the few naturally spotted breeds, very like the cats in ancient paintings |\n\n![Siamese](https://commons.wikimedia.org/wiki/Special:FilePath/Siam%20lilacpoint.jpg?width=500)\n\n### The cat is still wild\n\nUnlike the dog, the cat has changed little from its ancestor: the genomes of the domestic cat and the African wildcat are almost identical. It still hunts alone, still sleeps 12 to 16 hours a day and still marks territory. Purring, which the big cats lack, serves both to soothe and to ask for food, and there is evidence that its frequency helps bones heal. When a cat \"brings a gift\" to the door, it is doing what the wildcat does with its kittens: teaching them to hunt.\n\n*Images: Wikimedia Commons.*"}, {"lang": "pt", "text": "## Gatos domésticos pelo mundo\n\n![Gato doméstico](https://commons.wikimedia.org/wiki/Special:FilePath/Cat%20November%202010-1a.jpg?width=800)\n\nO gato de casa (*Felis catus*) é o felino mais numeroso do planeta: estima-se algo entre 400 e 600 milhões, em todos os continentes habitados. E é o único que escolheu, em boa parte, viver conosco.\n\n### Como o gato entrou em casa\n\nTodos os gatos domésticos descendem do **gato-selvagem-africano** (*Felis lybica*), um pequeno felino do Oriente Médio e do norte da África. A história começa há uns 10 mil anos, quando os primeiros agricultores do Crescente Fértil passaram a guardar grãos. Os grãos atraíam ratos; os ratos atraíam gatos selvagens. Os gatos menos medrosos ficavam perto das aldeias, comiam bem e deixavam mais filhotes. Foi uma domesticação de mão dupla: ninguém \"capturou\" o gato, ele se aproximou.\n\nA prova mais antiga dessa relação é um túmulo no Chipre, de cerca de 9.500 anos atrás, onde um humano foi enterrado ao lado de um gato. Como não existiam gatos selvagens no Chipre, alguém o levou de barco.\n\n### O Egito e os navios\n\nNo Egito, a partir de uns 4 mil anos atrás, o gato virou animal de estimação e de culto: a deusa Bastet tinha cabeça de gata, e matar um gato podia ser punido com a morte. Dali os gatos embarcaram em navios fenícios, romanos e, séculos depois, vikings, sempre com a mesma função: controlar ratos a bordo. É por isso que os gatos chegaram a praticamente todos os portos do mundo antes de qualquer outra rota. Estudos de DNA mostram que a linhagem egípcia dominou o mundo justamente por causa do comércio marítimo.\n\n### Raças: quatro exemplos de quatro continentes\n\n| Raça | Origem | O que a distingue |\n|---|---|---|\n| **Siamês** | Tailândia (antigo Sião), descrito desde o século XIV | Corpo claro e pontas escuras: o pigmento só se forma nas partes mais frias do corpo |\n| **Maine Coon** | Nordeste dos Estados Unidos | Uma das maiores raças, até 8 kg, pelagem densa para o inverno |\n| **Sphynx** | Canadá, a partir de 1966 | Mutação natural que suprime o pelo; precisa de banho e agasalho |\n| **Mau Egípcio** | Egito | Uma das poucas raças naturalmente pintadas, muito parecida com os gatos das pinturas antigas |\n\n![Siamês](https://commons.wikimedia.org/wiki/Special:FilePath/Siam%20lilacpoint.jpg?width=500)\n\n### O gato continua selvagem\n\nDiferente do cão, o gato mudou pouco em relação ao ancestral: o genoma do gato doméstico e o do gato-selvagem-africano são quase idênticos. Ele ainda caça sozinho, ainda dorme 12 a 16 horas por dia e ainda marca território. O ronronar, que os grandes felinos não têm, serve tanto para acalmar quanto para pedir comida, e há indícios de que a frequência do ronrom ajuda na cicatrização de ossos. Quando um gato \"traz um presente\" para a porta, ele está fazendo o que o gato-selvagem faz com os filhotes: ensinar a caçar.\n\n*Imagens: Wikimedia Commons.*"}, {"lang": "zh", "text": "## 世界各地的家猫\n\n![家猫](https://commons.wikimedia.org/wiki/Special:FilePath/Cat%20November%202010-1a.jpg?width=800)\n\n家猫（*Felis catus*）是地球上数量最多的猫科动物：估计在 4 亿到 6 亿之间，遍布每一个有人居住的大陆。它也是唯一在很大程度上主动选择与我们同住的猫科动物。\n\n### 猫是如何走进家门的\n\n所有家猫都源自**非洲野猫**（*Felis lybica*），一种生活在中东和北非的小型猫科动物。故事始于大约一万年前，新月沃地的第一批农民开始储存谷物。谷物引来老鼠，老鼠引来野猫。不那么胆怯的猫留在村庄附近，吃得好，留下更多后代。这是一场双向的驯化：没有人\"捕获\"猫，是猫自己靠近了人类。\n\n这段关系最古老的证据是塞浦路斯的一座约 9500 年前的墓葬，一个人与一只猫合葬。由于塞浦路斯没有野猫，一定是有人乘船把它带去的。\n\n### 埃及与船只\n\n在埃及，从大约 4000 年前起，猫成为宠物和崇拜对象：女神巴斯特长着猫头，杀猫可能被处死。从那里，猫登上了腓尼基人、罗马人以及几个世纪后维京人的船只，始终担任同一职务：控制船上的老鼠。正因如此，猫比任何其他路线都更早到达了世界上几乎每一个港口。DNA 研究表明，埃及谱系正是凭借海上贸易征服了世界。\n\n### 品种：来自四大洲的四个例子\n\n| 品种 | 起源 | 独特之处 |\n|---|---|---|\n| **暹罗猫** | 泰国（旧称暹罗），自 14 世纪起有记载 | 身体浅色、四肢末端深色：色素只在身体较凉的部位形成 |\n| **缅因猫** | 美国东北部 | 最大的品种之一，可达 8 公斤，毛皮浓密以抵御冬季 |\n| **斯芬克斯猫** | 加拿大，始于 1966 年 | 一种抑制毛发的自然突变；需要洗澡和保暖衣物 |\n| **埃及猫** | 埃及 | 少数天然带斑点的品种之一，与古代绘画中的猫极为相似 |\n\n![暹罗猫](https://commons.wikimedia.org/wiki/Special:FilePath/Siam%20lilacpoint.jpg?width=500)\n\n### 猫依然野性未改\n\n与狗不同，猫相对于祖先的变化很小：家猫与非洲野猫的基因组几乎完全相同。它依然独自狩猎，依然每天睡 12 到 16 小时，依然标记领地。大型猫科动物所没有的呼噜声，既用来安抚，也用来讨食，而且有证据表明其频率有助于骨骼愈合。当一只猫把\"礼物\"带到门口时，它做的正是野猫对幼崽做的事：教它们狩猎。\n\n*图片：维基共享资源。*"}]}}, {"id": "q1", "type": "quiz", "section": 2, "title": [{"lang": "en", "text": "Check"}, {"lang": "pt", "text": "Verificação"}, {"lang": "zh", "text": "检验"}], "content": {"items": [{"key": "habitat", "question": [{"lang": "en", "text": "Which of these cats lives in the mountains of Central Asia, above 3,000 metres, and cannot roar?"}, {"lang": "pt", "text": "Qual destes felinos vive nas montanhas da Ásia Central, acima de 3.000 metros, e não consegue rugir?"}, {"lang": "zh", "text": "以下哪种猫科动物生活在中亚海拔 3000 米以上的山地，并且不会吼叫？"}], "options": [{"value": "jaguar", "label": [{"lang": "en", "text": "Jaguar"}, {"lang": "pt", "text": "Onça-pintada"}, {"lang": "zh", "text": "美洲豹"}], "correct": false}, {"value": "snow-leopard", "label": [{"lang": "en", "text": "Snow leopard"}, {"lang": "pt", "text": "Leopardo-das-neves"}, {"lang": "zh", "text": "雪豹"}], "correct": true}, {"value": "lion", "label": [{"lang": "en", "text": "Lion"}, {"lang": "pt", "text": "Leão"}, {"lang": "zh", "text": "狮子"}], "correct": false}, {"value": "serval", "label": [{"lang": "en", "text": "Serval"}, {"lang": "pt", "text": "Serval"}, {"lang": "zh", "text": "薮猫"}], "correct": false}], "feedback": [{"lang": "en", "text": "The snow leopard lives in the Himalayas and neighbouring ranges. Although it is a Panthera, its throat does not allow a full roar."}, {"lang": "pt", "text": "O leopardo-das-neves vive no Himalaia e nas cadeias vizinhas. Apesar de ser um Panthera, sua garganta não permite o rugido completo."}, {"lang": "zh", "text": "雪豹生活在喜马拉雅山及邻近山脉。虽然属于豹属，但它的喉部结构无法发出完整的吼叫。"}]}, {"key": "ancestor", "question": [{"lang": "en", "text": "Which species do all domestic cats descend from?"}, {"lang": "pt", "text": "De que espécie descendem todos os gatos domésticos?"}, {"lang": "zh", "text": "所有家猫都源自哪个物种？"}], "options": [{"value": "lynx", "label": [{"lang": "en", "text": "Eurasian lynx"}, {"lang": "pt", "text": "Lince-eurasiático"}, {"lang": "zh", "text": "欧亚猞猁"}], "correct": false}, {"value": "european-wildcat", "label": [{"lang": "en", "text": "European wildcat"}, {"lang": "pt", "text": "Gato-selvagem-europeu"}, {"lang": "zh", "text": "欧洲野猫"}], "correct": false}, {"value": "african-wildcat", "label": [{"lang": "en", "text": "African wildcat"}, {"lang": "pt", "text": "Gato-selvagem-africano"}, {"lang": "zh", "text": "非洲野猫"}], "correct": true}, {"value": "manul", "label": [{"lang": "en", "text": "Pallas's cat"}, {"lang": "pt", "text": "Gato-de-pallas"}, {"lang": "zh", "text": "兔狲"}], "correct": false}], "feedback": [{"lang": "en", "text": "The ancestor is the African wildcat (Felis lybica), from the Middle East and North Africa, which approached the first farming villages."}, {"lang": "pt", "text": "O ancestral é o gato-selvagem-africano (Felis lybica), do Oriente Médio e norte da África, que se aproximou das primeiras aldeias agrícolas."}, {"lang": "zh", "text": "祖先是非洲野猫（Felis lybica），来自中东和北非，它主动靠近了最早的农业村落。"}]}, {"key": "social", "question": [{"lang": "en", "text": "Which is the only cat that lives in stable social groups and hunts together?"}, {"lang": "pt", "text": "Qual é o único felino que vive em grupos sociais estáveis e caça em conjunto?"}, {"lang": "zh", "text": "哪种猫科动物是唯一以稳定群体生活并集体狩猎的？"}], "options": [{"value": "lion", "label": [{"lang": "en", "text": "Lion"}, {"lang": "pt", "text": "Leão"}, {"lang": "zh", "text": "狮子"}], "correct": true}, {"value": "tiger", "label": [{"lang": "en", "text": "Tiger"}, {"lang": "pt", "text": "Tigre"}, {"lang": "zh", "text": "老虎"}], "correct": false}, {"value": "cheetah", "label": [{"lang": "en", "text": "Cheetah"}, {"lang": "pt", "text": "Guepardo"}, {"lang": "zh", "text": "猎豹"}], "correct": false}, {"value": "leopard", "label": [{"lang": "en", "text": "Leopard"}, {"lang": "pt", "text": "Leopardo"}, {"lang": "zh", "text": "花豹"}], "correct": false}], "feedback": [{"lang": "en", "text": "Only the lion forms prides. The other cats are solitary, meeting only to mate or raise kittens."}, {"lang": "pt", "text": "Só o leão forma bandos. Os outros felinos são solitários, com encontros apenas para acasalar ou criar filhotes."}, {"lang": "zh", "text": "只有狮子会组成狮群。其他猫科动物都是独居的，只在交配或抚养幼崽时相聚。"}]}, {"key": "water", "question": [{"lang": "en", "text": "Which cat can go months without drinking water, taking its liquid only from its prey?"}, {"lang": "pt", "text": "Qual felino consegue passar meses sem beber água, tirando o líquido apenas das presas?"}, {"lang": "zh", "text": "哪种猫科动物可以数月不喝水，仅从猎物中获取水分？"}], "options": [{"value": "puma", "label": [{"lang": "en", "text": "Puma"}, {"lang": "pt", "text": "Puma"}, {"lang": "zh", "text": "美洲狮"}], "correct": false}, {"value": "maine-coon", "label": [{"lang": "en", "text": "Maine Coon"}, {"lang": "pt", "text": "Maine Coon"}, {"lang": "zh", "text": "缅因猫"}], "correct": false}, {"value": "jaguar", "label": [{"lang": "en", "text": "Jaguar"}, {"lang": "pt", "text": "Onça-pintada"}, {"lang": "zh", "text": "美洲豹"}], "correct": false}, {"value": "sand-cat", "label": [{"lang": "en", "text": "Sand cat"}, {"lang": "pt", "text": "Gato-do-deserto"}, {"lang": "zh", "text": "沙猫"}], "correct": true}], "feedback": [{"lang": "en", "text": "The sand cat lives in the Sahara and the deserts of Asia and gets the water it needs from the prey it hunts."}, {"lang": "pt", "text": "O gato-do-deserto vive no Saara e em desertos da Ásia e obtém a água de que precisa das presas que caça."}, {"lang": "zh", "text": "沙猫生活在撒哈拉和亚洲的沙漠中，所需水分全部来自捕获的猎物。"}]}]}}, {"id": "b1", "type": "bool", "section": 2, "title": [{"lang": "en", "text": "Want a visual portrait?"}, {"lang": "pt", "text": "Quer um retrato visual?"}, {"lang": "zh", "text": "想要一张可视化肖像吗？"}], "content": {"question": [{"lang": "en", "text": "Would you like to see a visual card, generated right now, with the cat that best matches your profile and your answers?"}, {"lang": "pt", "text": "Quer ver um cartão visual, gerado agora, com o felino que mais combina com o seu perfil e as suas respostas?"}, {"lang": "zh", "text": "你想看一张现在生成的可视化卡片，展示与你的档案和答案最匹配的猫科动物吗？"}], "yes-label": [{"lang": "en", "text": "Yes"}, {"lang": "pt", "text": "Sim"}, {"lang": "zh", "text": "是"}], "no-label": [{"lang": "en", "text": "No"}, {"lang": "pt", "text": "Não"}, {"lang": "zh", "text": "否"}]}}, {"id": "dm1", "type": "dynamic-md", "section": 2, "title": [{"lang": "en", "text": "Personalised reinforcement"}, {"lang": "pt", "text": "Reforço personalizado"}, {"lang": "zh", "text": "个性化强化"}], "content": {"prompt": [{"lang": "en", "text": "The student just took a 4-question quiz about cats of the world and scored below 70%. Write a short, encouraging remediation in markdown (250-350 words).\n\nInputs:\n- Group the student chose to explore: {{STORAGE: f1.interest}} (big = big cats, small = small wild cats, domestic = domestic cats)\n- Student's country: {{STORAGE: f1.country}}\n- Quiz score: {{STORAGE: q1.percent}}%\n- Their answer to \"which cat lives in Central Asian mountains and cannot roar\": {{STORAGE: q1.habitat}} (correct: snow-leopard)\n- Their answer to \"ancestor of the domestic cat\": {{STORAGE: q1.ancestor}} (correct: african-wildcat)\n- Their answer to \"only social cat\": {{STORAGE: q1.social}} (correct: lion)\n- Their answer to \"cat that can live without drinking water\": {{STORAGE: q1.water}} (correct: sand-cat)\n\nStructure: one sentence acknowledging what they got right; then, for each question they missed, a short paragraph that explains the correct answer and why their choice was a tempting mistake (do not lecture on questions they answered correctly); close with a memorable one-line mnemonic for each missed fact. If a country is given, add one sentence connecting a felid to that country or region (a native species, or a well-known zoo or conservation project) only if you are confident it is accurate. Do not include images. Answer in the student's language."}]}}, {"id": "dh1", "type": "dynamic-html", "section": 2, "title": [{"lang": "en", "text": "Your ideal cat"}, {"lang": "pt", "text": "Seu felino ideal"}, {"lang": "zh", "text": "你的理想猫科动物"}], "content": {"prompt": [{"lang": "en", "text": "Create a self-contained HTML fragment (no \u003chtml>, \u003chead> or \u003cscript> tags; inline CSS only) that presents a \"profile card\" of the ONE wild or domestic cat species that best matches this student. Pick the species yourself, with a short justification.\n\nInputs:\n- Group the student chose: {{STORAGE: f1.interest}} (big, small or domestic)\n- Student's country: {{STORAGE: f1.country}}\n- Quiz score: {{STORAGE: q1.percent}}%\n\nRules for choosing: prefer a species from the chosen group; if a country is given and a felid of that group is native to that country or region, prefer it. Do NOT use \u003cimg> tags or any image URLs; instead draw a simple decorative header with inline SVG (an abstract cat silhouette or a paw print made from basic shapes).\n\nThe card must contain: species common name and scientific name; a 2-column table with habitat, size, diet, conservation status (IUCN category, if you are confident), and one signature behaviour; a 3-sentence paragraph \"why this cat matches you\"; and a one-line fun fact. Keep it under 300 words, use a warm colour palette (sand, ochre, dark brown), and make it readable on a phone (max-width 100%, no fixed widths). All visible text in the student's language."}]}}, {"id": "f2", "type": "form", "section": 3, "title": [{"lang": "en", "text": "The cat you would adopt"}, {"lang": "pt", "text": "O felino que você adotaria"}, {"lang": "zh", "text": "你会领养的猫科动物"}], "content": {"instructions": [{"lang": "en", "text": "## The cat you would adopt\n\nImagine you could \"adopt\" a cat, in a symbolic sense: supporting the conservation of a wild species, or actually taking a domestic cat home. Choose **one** species or breed seen in this course (or another you know well) and write a text of **150 to 250 words** defending your choice.\n\nYour text must answer four questions:\n\n1. **Where it lives** and in what kind of environment (habitat).\n2. **What it eats** and how it hunts.\n3. **Which behaviour** makes it special to you.\n4. **What it would need** to live well, whether in the wild or in your home.\n\nWrite in the first person, as if you were convincing a friend. You will receive a comment on what you wrote; if your text still has gaps, you will get some tips and can rewrite it."}, {"lang": "pt", "text": "## O felino que você adotaria\n\nImagine que você pudesse \"adotar\" um felino, no sentido simbólico: apoiar a conservação de uma espécie selvagem, ou de fato levar um gato doméstico para casa. Escolha **uma** espécie ou raça vista neste curso (ou outra que você conheça bem) e escreva um texto de **150 a 250 palavras** defendendo a escolha.\n\nO texto precisa responder a quatro perguntas:\n\n1. **Onde ele vive** e em que tipo de ambiente (habitat).\n2. **Do que ele se alimenta** e como caça.\n3. **Que comportamento** o torna especial para você.\n4. **Do que ele precisaria** para viver bem, seja na natureza, seja na sua casa.\n\nEscreva em primeira pessoa, como se estivesse convencendo um amigo. Você receberá um comentário sobre o que escreveu; se o texto ainda tiver lacunas, vai ganhar algumas dicas e poderá reescrever."}, {"lang": "zh", "text": "## 你会领养的猫科动物\n\n想象你可以在象征意义上\"领养\"一种猫科动物：支持某个野生物种的保护，或者真正把一只家猫带回家。从本课程中出现的物种或品种（或你熟悉的其他物种）中选择**一种**，写一篇 **150 到 250 字**的短文为你的选择辩护。\n\n短文需要回答四个问题：\n\n1. **它生活在哪里**，在什么样的环境中（栖息地）。\n2. **它吃什么**，如何狩猎。\n3. **哪种行为**让它对你来说与众不同。\n4. **它需要什么**才能生活得好，无论是在野外还是在你家里。\n\n用第一人称写作，就像在说服一位朋友。你将收到关于所写内容的评语；如果短文仍有欠缺，你会得到一些建议并可以重写。"}], "items": [{"key": "text", "type": "text-area", "required": true, "label": [{"lang": "en", "text": "Your text"}, {"lang": "pt", "text": "Seu texto"}, {"lang": "zh", "text": "你的短文"}], "min-words": 150, "max-words": 250}]}}, {"id": "s1", "type": "score", "section": 3, "title": [{"lang": "en", "text": "Measuring your text"}, {"lang": "pt", "text": "Medindo seu texto"}, {"lang": "zh", "text": "评估你的短文"}], "content": {"state": {"task": "Choose one cat species or breed and write 150 to 250 words arguing for 'adopting' it -- supporting a wild species' conservation, or taking a domestic cat home. The text must cover where it lives, what it eats and how it hunts, one behaviour that makes it special, and what it would need to live well. First person, addressed to a friend.", "answer": "{{STORAGE: f2.text}}"}, "items": [{"key": "habitat", "instructions": "Judge only whether the field answer describes where the chosen cat lives and in what kind of environment, and whether that is factually right. Ignore grammar, length and tone.", "criteria": ["Says nothing about where the animal lives, or places it on the wrong continent", "Names the habitat in general terms, broadly right", "Describes the habitat specifically and accurately, with a detail that fits the species"], "points": [0, 12, 25]}, {"key": "diet", "instructions": "Judge only whether the field answer describes what the chosen cat eats and how it hunts, and whether that is factually right. Ignore everything else.", "criteria": ["Says nothing about diet or hunting, or gets them wrong", "Names what it eats, without how it hunts", "Describes both diet and hunting behaviour accurately"], "points": [0, 12, 25]}, {"key": "trait", "instructions": "Judge only whether the field answer gives one specific and accurate behaviour or trait that justifies the choice. A generic compliment is not a trait.", "criteria": ["Gives no particular trait, only that the animal is nice or beautiful", "Names a trait, but one that fits almost any cat", "Names a trait specific to the species and true of it, and ties it to the choice"], "points": [0, 12, 25]}, {"key": "needs", "instructions": "Judge only whether the field answer states realistically what the animal would need to live well, in the wild or at home.", "criteria": ["Says nothing about what the animal needs, or something unrealistic", "Mentions a need in passing", "States concretely what it needs and why that is hard or easy to provide"], "points": [0, 7, 15]}, {"key": "tone", "instructions": "Judge only whether the field answer reads as a clear, first-person argument addressed to a friend. Do not judge the facts, and do not penalise typos.", "criteria": ["Disorganised, or not an argument at all", "Clear enough to follow, but flat", "Clear and genuinely persuasive"], "points": [0, 5, 10]}]}}, {"id": "dm3", "type": "dynamic-md", "section": 3, "title": [{"lang": "en", "text": "Your feedback"}, {"lang": "pt", "text": "Sua devolutiva"}, {"lang": "zh", "text": "你的评语"}], "content": {"from": "s1", "prompt": [{"lang": "en", "text": "Write 4 to 6 sentences to a student of a general-audience course on the cats of the world, in their language, about the short persuasive text they just wrote on a cat they would 'adopt'. Open by naming the species they chose and one thing that genuinely works in their text. Then give the single most useful improvement, taken from the weakest question of the judgement below, and say concretely what to add or change. Where the judgement is unsure about a question, say so plainly rather than overstating. Warm and specific, never a tally. Give no numbers. Decide nothing: the judgement below is settled, and your job is to put it into words the student can act on."}]}}, {"id": "sm4", "type": "static-md", "section": 3, "title": [{"lang": "en", "text": "Tips to improve your text"}, {"lang": "pt", "text": "Dicas para melhorar seu texto"}, {"lang": "zh", "text": "改进短文的建议"}], "content": {"item": [{"lang": "en", "text": "## Tips to improve your text\n\nYour text still has a gap or two, and that usually happens for one of three reasons. Read the comment you received, see which one applies to you and go back to rewrite.\n\n### 1. One of the four questions went unanswered\n\nThe text needs to say **where** the cat lives, **what** it eats and how it hunts, **which** behaviour makes it special and **what** it needs. A simple trick: write one short paragraph for each question, in that order. Four paragraphs of 40 to 60 words already add up to the requested length.\n\n### 2. A fact is wrong\n\nThe most common mistakes:\n\n- Placing a cat on the wrong continent. The jaguar exists only in the Americas; the leopard only in Africa and Asia; the tiger only in Asia.\n- Mixing up who roars and who purrs. Lion, tiger, jaguar and leopard roar. Puma, cheetah and all the small cats purr.\n- Calling the cheetah \"the strongest cat\". It is the fastest, but light and fragile: it often loses its prey to hyenas and lions.\n- Describing the domestic cat as an animal that \"needs a pack\". It is solitary by nature; what it needs is territory, hiding places and play that mimics hunting.\n\nIf in doubt, reread the chapter of the group you chose.\n\n### 3. The text does not convince\n\nSwapping \"it is really cool\" for a concrete fact changes everything. Compare:\n\n> *Weak:* \"The serval is amazing and I would love to have one.\"\n>\n> *Strong:* \"The serval lands half of its hunts, leaping two metres to come down on a mouse it never saw, only heard. An animal like that needs open space and tall grass, which is why I would support a savanna reserve, not a cage.\"\n\nThe second example shows habitat, behaviour and need in two sentences.\n\n### Before resubmitting\n\n- Count the words: between 150 and 250.\n- Check the scientific name or the correct common name.\n- Read it aloud: if a sentence does not convince you, it will not convince the reader.\n\nWhen you are ready, move on to rewrite."}, {"lang": "pt", "text": "## Dicas para melhorar seu texto\n\nSeu texto ainda tem uma lacuna ou outra, e isso normalmente acontece por um de três motivos. Leia o comentário que você recebeu, veja qual é o seu caso e volte para reescrever.\n\n### 1. Faltou responder a uma das quatro perguntas\n\nO texto precisa dizer **onde** o felino vive, **o que** ele come e como caça, **qual** comportamento o torna especial e **do que** ele precisa. Um truque simples: escreva um parágrafo curto para cada pergunta, nessa ordem. Quatro parágrafos de 40 a 60 palavras já somam o tamanho pedido.\n\n### 2. Um fato está errado\n\nOs erros mais comuns:\n\n- Colocar um felino no continente errado. A onça-pintada só existe nas Américas; o leopardo só na África e na Ásia; o tigre só na Ásia.\n- Confundir quem ruge e quem ronrona. Leão, tigre, onça e leopardo rugem. Puma, guepardo e todos os pequenos felinos ronronam.\n- Chamar o guepardo de \"o felino mais forte\". Ele é o mais rápido, mas leve e frágil: muitas vezes perde a presa para hienas e leões.\n- Descrever o gato doméstico como um animal que \"precisa de um bando\". Ele é solitário por natureza; o que precisa é de território, esconderijos e brincadeira que imite a caça.\n\nSe tiver dúvida, releia o capítulo do grupo que você escolheu.\n\n### 3. O texto não convence\n\nTrocar \"ele é muito legal\" por um fato concreto muda tudo. Compare:\n\n> *Fraco:* \"O serval é incrível e eu adoraria ter um.\"\n>\n> *Forte:* \"O serval acerta metade das caçadas, saltando dois metros para cair em cima de um rato que ele nem viu, só ouviu. Um animal assim precisa de espaço aberto e capim alto, e por isso eu apoiaria uma reserva na savana, não uma gaiola.\"\n\nO segundo exemplo mostra habitat, comportamento e necessidade em duas frases.\n\n### Antes de reenviar\n\n- Conte as palavras: entre 150 e 250.\n- Confira o nome científico ou o nome comum correto.\n- Leia em voz alta: se uma frase não convence você, não vai convencer o leitor.\n\nQuando estiver pronto, avance para reescrever."}, {"lang": "zh", "text": "## 改进短文的建议\n\n你的短文还有一两处欠缺，这通常出于以下三个原因之一。阅读你收到的评语，看看哪一条适用于你，然后返回重写。\n\n### 1. 四个问题中有一个没有回答\n\n短文需要说明猫科动物**生活在哪里**、**吃什么**以及如何狩猎、**哪种行为**让它与众不同，以及**它需要什么**。一个简单的技巧：按这个顺序为每个问题写一小段。四段各 40 到 60 字，加起来就达到了要求的篇幅。\n\n### 2. 有一个事实错了\n\n最常见的错误：\n\n- 把猫科动物放错了大陆。美洲豹只存在于美洲；花豹只在非洲和亚洲；老虎只在亚洲。\n- 混淆谁会吼叫、谁会呼噜。狮子、老虎、美洲豹和花豹会吼叫。美洲狮、猎豹和所有小型猫科动物会呼噜。\n- 称猎豹为\"最强壮的猫科动物\"。它是最快的，但体轻而脆弱：经常把猎物输给鬣狗和狮子。\n- 把家猫描述为\"需要群体\"的动物。它天性独居；它需要的是领地、藏身之处，以及模拟狩猎的游戏。\n\n如有疑问，请重读你所选类群的章节。\n\n### 3. 短文缺乏说服力\n\n把\"它真的很酷\"换成一个具体的事实，一切都会改变。比较一下：\n\n> *弱：*\"薮猫太棒了，我很想养一只。\"\n>\n> *强：*\"薮猫一半的狩猎都能成功，它跃起两米，扑向一只它从未看见、只是听见的老鼠。这样的动物需要开阔的空间和高草，所以我会支持一个草原保护区，而不是一个笼子。\"\n\n第二个例子用两句话展示了栖息地、行为和需求。\n\n### 重新提交前\n\n- 数一数字数：在 150 到 250 之间。\n- 核对学名或正确的俗名。\n- 大声朗读：如果一句话不能说服你，它也不能说服读者。\n\n准备好后，前进去重写。"}]}}, {"id": "dm2", "type": "dynamic-md", "section": 3, "title": [{"lang": "en", "text": "Summary of your journey"}, {"lang": "pt", "text": "Síntese da sua jornada"}, {"lang": "zh", "text": "你的旅程小结"}], "content": {"prompt": [{"lang": "en", "text": "Write a personalised closing summary in markdown (250-350 words) for a student who has just finished one pass through a short course on the cats of the world.\n\nInputs:\n- Group the student explored in this pass: {{STORAGE: f1.interest}} (big, small or domestic)\n- Student's country: {{STORAGE: f1.country}}\n- Quiz score: {{STORAGE: q1.percent}}%\n- The student's text about the cat they would adopt: {{STORAGE: f2.text}}\n- How that text came out of 100: {{STORAGE: s1.percent}}\n- Where it was weakest, as levels on their own scales: habitat {{STORAGE: s1.habitat}}, diet {{STORAGE: s1.diet}}, trait {{STORAGE: s1.trait}}, needs {{STORAGE: s1.needs}}, tone {{STORAGE: s1.tone}} (each runs 0 to 2)\n\nStructure:\n1. A warm two-sentence opening that names the specific cat the student chose and one detail from their own text.\n2. \"What you now know\": three bullet points tying the group they explored to the course objectives (distinguish big from small cats and where they live; what makes felids efficient hunters; the story of cat domestication), phrased as things they can now do.\n3. \"One thing to take further\": a single concrete suggestion that builds on the weakest of the levels above, such as one accurate fact about the chosen species they did not mention, or a conservation organisation or field guide relevant to the chosen species (only if you are confident it exists).\n4. A closing line inviting them to explore another group of cats if they have not yet.\nDo not include images. Do not repeat the comment they already read. Answer in the student's language."}]}}, {"id": "b2", "type": "bool", "section": 3, "title": [{"lang": "en", "text": "Explore another group?"}, {"lang": "pt", "text": "Explorar outro grupo?"}, {"lang": "zh", "text": "探索另一个类群？"}], "content": {"question": [{"lang": "en", "text": "You have completed one pass through the course. Would you like to go back to the start and explore another group of cats?"}, {"lang": "pt", "text": "Você terminou uma volta pelo curso. Quer voltar ao início e explorar outro grupo de felinos?"}, {"lang": "zh", "text": "你已经完成了一轮课程。想回到起点探索另一类猫科动物吗？"}], "yes-label": [{"lang": "en", "text": "Yes"}, {"lang": "pt", "text": "Sim"}, {"lang": "zh", "text": "是"}], "no-label": [{"lang": "en", "text": "No"}, {"lang": "pt", "text": "Não"}, {"lang": "zh", "text": "否"}]}}, {"id": "sm5", "type": "static-md", "section": 3, "title": [{"lang": "en", "text": "Closing"}, {"lang": "pt", "text": "Encerramento"}, {"lang": "zh", "text": "结课"}], "content": {"item": [{"lang": "en", "text": "## Closing\n\n![Puma](https://commons.wikimedia.org/wiki/Special:FilePath/Puma%20face.jpg?width=800)\n\nYou have reached the end of the journey. It is worth looking back at what stays with you.\n\n### What cats have in common\n\nA single body plan, tuned to each environment: retractable claws to keep the tips sharp, teeth that slice rather than chew, eyes with a reflective layer that multiplies the light of the night, whiskers that feel the air, and a body built for the ambush rather than the long chase. The cheetah is the exception that proves the rule: to run, it gave up strength and fully retractable claws.\n\n### What sets them apart\n\n- **The big cats** roar, rule large territories and sustain whole ecosystems. All seven are in decline, and protecting one of them protects the landscape around it.\n- **The small wild cats** are 33 almost unknown species, living from snow to desert. They are the least studied and the ones that most need attention.\n- **The domestic cat** is the cat that came to us 10,000 years ago and conquered the world on ships, without ceasing to be a solitary hunter.\n\n### To go further\n\n- Look up the **IUCN Red List** (iucnredlist.org) to see the status of any species mentioned here.\n- If you have a cat at home, watch a week of its behaviour with this course's eyes: where it sleeps, what it \"hunts\", how it marks territory.\n- If you want to meet a real wild cat, visit a reserve or a conservation centre rather than a place offering direct contact: cats used for photos with tourists are rarely well treated.\n\nThank you for exploring the cats of the world. You can go back to the start at any time and walk a different group: the path and the generated texts will be different.\n\n*Image: Wikimedia Commons.*"}, {"lang": "pt", "text": "## Encerramento\n\n![Puma](https://commons.wikimedia.org/wiki/Special:FilePath/Puma%20face.jpg?width=800)\n\nVocê chegou ao fim da viagem. Vale olhar para trás e ver o que ficou.\n\n### O que os felinos têm em comum\n\nUm só projeto de corpo, ajustado a cada ambiente: garras retráteis para manter a ponta afiada, dentes que cortam em vez de mastigar, olhos com uma camada refletora que multiplica a luz da noite, bigodes que sentem o ar e um corpo feito para a emboscada e não para a perseguição longa. O guepardo é a exceção que confirma a regra: para correr, ele abriu mão da força e das garras totalmente retráteis.\n\n### O que os separa\n\n- **Os grandes felinos** rugem, dominam grandes territórios e sustentam ecossistemas inteiros. Todos os sete estão em declínio, e proteger um deles protege a paisagem em volta.\n- **Os pequenos felinos selvagens** são 33 espécies quase desconhecidas, vivendo da neve ao deserto. São os menos estudados e os que mais precisam de atenção.\n- **O gato doméstico** é o felino que se aproximou de nós há 10 mil anos e conquistou o mundo em navios, sem deixar de ser um caçador solitário.\n\n### Para continuar\n\n- Procure a **Lista Vermelha da IUCN** (iucnredlist.org) para ver a situação de qualquer espécie citada aqui.\n- Se você tem um gato em casa, observe uma semana de comportamento com o olhar deste curso: onde ele dorme, o que ele \"caça\", como marca território.\n- Se você quiser conhecer um felino selvagem de verdade, visite uma reserva ou um centro de conservação em vez de um lugar que ofereça contato direto: felinos usados para fotos com turistas raramente são bem tratados.\n\nObrigado por explorar os gatos do mundo. Você pode voltar ao início a qualquer momento e percorrer um grupo diferente: o caminho e os textos gerados serão outros.\n\n*Imagem: Wikimedia Commons.*"}, {"lang": "zh", "text": "## 结课\n\n![美洲狮](https://commons.wikimedia.org/wiki/Special:FilePath/Puma%20face.jpg?width=800)\n\n你已到达旅程的终点。值得回头看看留下了什么。\n\n### 猫科动物的共同点\n\n同一套身体结构，针对各自的环境微调：可伸缩的爪子保持爪尖锋利，切割而非咀嚼的牙齿，带反光层、能放大夜间光线的眼睛，感知空气的胡须，以及为伏击而非长途追逐而生的身体。猎豹是证明规则的例外：为了奔跑，它放弃了力量和完全可伸缩的爪子。\n\n### 它们的不同之处\n\n- **大型猫科动物**会吼叫，统治广阔的领地，支撑整个生态系统。七种都在减少，保护其中一种就是保护它周围的整片土地。\n- **小型野生猫科动物**是 33 个几乎不为人知的物种，从雪地到沙漠都有分布。它们研究最少，也最需要关注。\n- **家猫**是一万年前来到我们身边、随船只征服世界的猫科动物，却从未停止做一名独居的猎手。\n\n### 继续探索\n\n- 查阅 **IUCN 红色名录**（iucnredlist.org），了解这里提到的任何物种的现状。\n- 如果你家里有猫，用本课程的眼光观察它一周的行为：它在哪里睡觉，它\"猎捕\"什么，它如何标记领地。\n- 如果你想见到真正的野生猫科动物，请去保护区或保育中心，而不是提供直接接触的场所：用于与游客合影的猫科动物很少得到善待。\n\n感谢你探索世界的猫科动物。你可以随时回到起点，走一遍不同的类群：路径和生成的文本都会不同。\n\n*图片：维基共享资源。*"}]}}], "edges": [{"from": "sm1", "to": "f1"}, {"from": "f1", "to": "sh1", "when": {"key": "f1.interest", "operator": "eq", "value": "big"}},
